<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eBay AI Automation SaaS</title>
    <style>
        :root {
            --primary: #0064FF;
            --dark: #121212;
            --glass: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 1000px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input {
            flex: 1;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 16px;
        }
        button {
            padding: 15px 30px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,100,255,0.3);
        }
        .result-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
            display: none;
        }
        .card {
            background: rgba(255,255,255,0.03);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        img {
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>eBay AI SaaS Dashboard</h1>
            <p>Paste product URL from Coupang, Naver, Musinsa, or Olive Young</p>
        </header>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="https://www.musinsa.com/app/goods/...">
            <button onclick="processListing()">AI 가공 및 리스팅</button>
        </div>

        <div class="loading" id="loader">AI가 이미지를 세탁하고 정보를 생성 중입니다...</div>

        <div class="result-panel" id="resultPanel">
            <div class="card">
                <h3>AI 가공 완료 이미지</h3>
                <img id="processedImg" src="" alt="Processed Image">
                <p style="font-size: 12px; color: #888; margin-top: 10px;">* API 키 미설정 시 원본 이미지가 표시됩니다.</p>
            </div>
            <div class="card">
                <h3>AI 생성 상품 정보</h3>
                <p><strong>제목:</strong> <span id="resTitle"></span></p>
                <p><strong>가격:</strong> <span id="resPrice"></span></p>
                <p><strong>카테고리:</strong> <span id="resCategory"></span></p>
                <button style="width: 100%; margin-top: 10px; background: #28a745;">이베이 최종 등록 승인</button>
            </div>
        </div>
    </div>

    <script>
        async function processListing() {
            const url = document.getElementById('urlInput').value;
            const loader = document.getElementById('loader');
            const panel = document.getElementById('resultPanel');
            
            if(!url) return alert("URL을 입력해주세요.");

            loader.style.display = 'block';
            panel.style.display = 'none';

            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url: url})
                });
                const result = await response.json();
                
                document.getElementById('resTitle').innerText = result.title;
                document.getElementById('resPrice').innerText = result.original_price;
                document.getElementById('resCategory').innerText = result.category;
                
                // Add timestamp to prevent image caching
                const timestamp = new Date().getTime();
                document.getElementById('processedImg').src = "/" + result.image_path + "?t=" + timestamp;
                
                loader.style.display = 'none';
                panel.style.display = 'grid';
            } catch (e) {
                alert("처리 중 오류가 발생했습니다.");
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
