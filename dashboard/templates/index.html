<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOBI eBay SaaS - Professional Automation</title>
    <style>
        :root {
            --primary: #0064FF;
            --dark: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --sidebar-width: 320px;
        }
        body {
            font-family: 'Inter', 'Pretendard', sans-serif;
            background-color: var(--dark);
            color: var(--text);
            margin: 0;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Main Layout */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            transition: margin-right 0.3s ease;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Sidebar Styling */
        .sidebar {
            width: var(--sidebar-width);
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            background: rgba(15, 15, 15, 0.98);
            border-left: 1px solid rgba(255,255,255,0.1);
            padding: 40px 20px;
            box-sizing: border-box;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }
        .sidebar.collapsed {
            transform: translateX(var(--sidebar-width));
        }
        
        .sidebar-toggle {
            position: absolute;
            left: -40px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 80px;
            background: var(--primary);
            border: none;
            border-radius: 12px 0 0 12px;
            color: white;
            cursor: pointer;
            font-size: 20px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.3);
        }

        /* UI Components */
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 32px; margin-bottom: 5px; background: linear-gradient(to right, #fff, #0064FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .tabs { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
        .tab-btn { background: rgba(255,255,255,0.1); border: none; padding: 10px 20px; border-radius: 10px; color: white; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: var(--primary); font-weight: bold; }

        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input, select { flex: 1; padding: 12px 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; outline: none; }
        input:focus { border-color: var(--primary); }

        button.primary-btn { padding: 12px 24px; border-radius: 10px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; }
        
        .options { text-align: center; margin-bottom: 20px; font-size: 13px; color: #aaa; }

        /* Results Display */
        .result-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; display: none; }
        .card { background: rgba(255,255,255,0.02); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }
        
        .img-item { position: relative; border-radius: 10px; overflow: hidden; background: #000; }
        .img-item img { width: 100%; display: block; }
        .img-order { position: absolute; top: 8px; left: 8px; width: 30px; height: 30px; background: var(--primary); border: none; color: white; border-radius: 6px; text-align: center; font-weight: bold; font-size: 14px; }

        /* Calculator Sidebar Content */
        .sidebar h2 { font-size: 22px; margin-top: 0; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .calc-field { margin-bottom: 18px; }
        .calc-field label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
        .calc-field input { width: 100%; box-sizing: border-box; border-color: rgba(255,255,255,0.05); }
        
        .recommendation { margin-top: 30px; padding: 20px; background: var(--primary); border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,100,255,0.3); }
        .recommendation div { font-size: 13px; opacity: 0.8; margin-bottom: 5px; }
        .recommendation span { font-size: 28px; font-weight: 800; }

        .loading { display: none; color: var(--primary); text-align: center; margin: 20px; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    </style>
</head>
<body>

    <main class="main-content">
        <div class="container">
            <header>
                <h1>DOBI eBay SaaS</h1>
                <p>Global E-commerce Automation Platform</p>
            </header>

            <div class="tabs">
                <button class="tab-btn active" id="urlTabBtn" onclick="switchTab('url')">URL 단일 수집</button>
                <button class="tab-btn" id="bulkTabBtn" onclick="switchTab('bulk')">대량 수집 (Bulk)</button>
                <button class="tab-btn" id="fileTabBtn" onclick="switchTab('file')">직접 사진 업로드</button>
            </div>

            <div class="options">
                <label style="cursor: pointer;">
                    <input type="checkbox" id="skipAiCheck"> AI 배경 제거 건너뛰기 (원본 이미지 사용)
                </label>
            </div>

            <!-- URL Collection Tab -->
            <div id="urlInputGroup" class="input-group">
                <input type="text" id="urlInput" placeholder="쇼핑몰 상품 URL을 붙여넣으세요...">
                <button class="primary-btn" onclick="processUrl()">수집 및 가공</button>
            </div>

            <!-- Bulk Collection Tab -->
            <div id="bulkInputGroup" class="input-group" style="display: none; flex-direction: column;">
                <textarea id="bulkInput" rows="5" placeholder="여러 개의 URL을 한 줄에 하나씩 입력하세요..." style="width: 100%; background: rgba(0,0,0,0.3); color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 15px; margin-bottom: 10px;"></textarea>
                <button class="primary-btn" onclick="processBulk()">대량 수집 시작</button>
            </div>

            <!-- File Upload Tab -->
            <div id="fileInputGroup" class="input-group" style="display: none;">
                <input type="file" id="fileInput" accept="image/*" multiple>
                <button class="primary-btn" onclick="processFiles()">사진 업로드 및 가공</button>
            </div>

            <!-- Progress Bar Section -->
            <div id="taskProgress" style="display: none; margin-top: 20px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; border: 1px solid var(--primary);">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <span id="taskStatusText">대량 수집 중...</span>
                    <span id="taskPercent">0%</span>
                </div>
                <div style="width: 100%; height: 8px; background: #333; border-radius: 4px; overflow: hidden;">
                    <div id="taskBar" style="width: 0%; height: 100%; background: var(--primary); transition: width 0.3s;"></div>
                </div>
                <p id="taskCount" style="font-size: 12px; color: #888; margin-top: 10px; text-align: center;">0 / 0 완료</p>
            </div>

            <div id="loader" class="loading">AI가 상품 정보를 분석하고 이미지를 세탁 중입니다...</div>

            <!-- Result Section -->
            <div id="resultPanel" class="result-panel">
                <div class="card">
                    <h3 style="margin-top: 0;">📸 이미지 순서 (1번: 대표)</h3>
                    <div id="imgGallery" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;"></div>
                </div>
                <div class="card">
                    <h3 style="margin-top: 0;">📝 리스팅 정보 편집</h3>
                    <div class="calc-field">
                        <label>이베이 판매 제목</label>
                        <input type="text" id="resTitle">
                    </div>
                    <div class="calc-field">
                        <label>최종 리스팅 가격 ($)</label>
                        <input type="number" id="resPrice" step="0.01" style="font-size: 20px; color: #00ff00; font-weight: bold;">
                    </div>
                    <div class="calc-field">
                        <label>카테고리 제안</label>
                        <input type="text" id="resCategory">
                    </div>
                    <button id="listBtn" onclick="listToEbay()" style="width: 100%; height: 55px; background: #28a745; border: none; color: white; font-weight: bold; border-radius: 12px; cursor: pointer; font-size: 16px;">이베이 즉시 등록 승인</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Margin Calculator Sidebar -->
    <aside class="sidebar" id="sidebar">
        <button class="sidebar-toggle" onclick="toggleSidebar()">📊</button>
        <h2>📊 마진 계산기</h2>
        <div class="calc-field">
            <label>상품 원가 (KRW)</label>
            <input type="number" id="costKrw" value="25000" oninput="runCalc()">
        </div>
        <div class="calc-field">
            <label>배송비 (KRW)</label>
            <input type="number" id="shipKrw" value="15000" oninput="runCalc()">
        </div>
        <div class="calc-field">
            <label>관세율 (%)</label>
            <input type="number" id="dutyRate" value="0" oninput="runCalc()">
        </div>
        <div class="calc-field">
            <label>희망 마진율 (%)</label>
            <input type="number" id="marginRate" value="25" oninput="calculateMargin()">
        </div>
        <div class="calc-field">
            <label>이베이 수수료 (%)</label>
            <input type="number" id="ebayFee" value="15" oninput="runCalc()">
        </div>
        <div class="calc-field">
            <label>적용 환율 ($1 = ?)</label>
            <input type="number" id="exchangeRate" value="1380" oninput="runCalc()">
        </div>

        <div class="recommendation">
            <div>이베이 권장 판매가</div>
            $ <span id="recPrice">0.00</span>
        </div>
        <p style="font-size: 11px; color: #666; margin-top: 20px; line-height: 1.5;">
            * 공식: ((원가+배송비)*(1+관세/100)) / (1-(수수료+마진)/100) / 환율
        </p>
    </aside>

    <script>
        let currentUrl = "";
        
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function switchTab(mode) {
            document.getElementById('urlTabBtn').classList.toggle('active', mode === 'url');
            document.getElementById('bulkTabBtn').classList.toggle('active', mode === 'bulk');
            document.getElementById('fileTabBtn').classList.toggle('active', mode === 'file');
            
            document.getElementById('urlInputGroup').style.display = mode === 'url' ? 'flex' : 'none';
            document.getElementById('bulkInputGroup').style.display = mode === 'bulk' ? 'flex' : 'none';
            document.getElementById('fileInputGroup').style.display = mode === 'file' ? 'flex' : 'none';
        }

        async function processBulk() {
            const input = document.getElementById('bulkInput').value;
            const urls = input.split('\n').map(u => u.trim()).filter(u => u.length > 0);
            
            if(urls.length === 0) return alert("수집할 URL을 입력하세요.");
            
            try {
                const resp = await fetch('/api/bulk_source', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({urls: urls})
                });
                const data = await resp.json();
                if(data.status === "success") {
                    startMonitoring(data.task_id);
                }
            } catch(e) { alert("대량 수집 시작 오류"); }
        }

        function startMonitoring(taskId) {
            const progressSection = document.getElementById('taskProgress');
            progressSection.style.display = 'block';
            
            const interval = setInterval(async () => {
                const resp = await fetch(`/api/task_status/${taskId}`);
                const data = await resp.json();
                
                document.getElementById('taskBar').style.width = data.percent + "%";
                document.getElementById('taskPercent').innerText = data.percent + "%";
                document.getElementById('taskCount').innerText = `${data.current} / ${data.total} 완료`;
                
                if(data.status === 'completed') {
                    clearInterval(interval);
                    document.getElementById('taskStatusText').innerText = "수집 완료!";
                    alert("🎉 대량 수집이 완료되었습니다. [내 상품] 목록에서 확인하세요!");
                } else if(data.status === 'failed') {
                    clearInterval(interval);
                    alert("❌ 수집 중 오류가 발생했습니다.");
                }
            }, 1500);
        }

        function runCalc() {
            const cost = parseFloat(document.getElementById('costKrw').value) || 0;
            const ship = parseFloat(document.getElementById('shipKrw').value) || 0;
            const duty = parseFloat(document.getElementById('dutyRate').value) || 0;
            const margin = parseFloat(document.getElementById('marginRate').value) || 0;
            const fee = parseFloat(document.getElementById('ebayFee').value) || 15;
            const exRate = parseFloat(document.getElementById('exchangeRate').value) || 1350;

            const base = (cost + ship) * (1 + duty/100);
            const divisor = 1 - (fee + margin)/100;
            
            if (divisor > 0) {
                const rec = base / divisor / exRate;
                document.getElementById('recPrice').innerText = rec.toFixed(2);
            }
        }
        runCalc(); // Initial run

        async function processUrl() {
            const url = document.getElementById('urlInput').value;
            const skipAi = document.getElementById('skipAiCheck').checked;
            if(!url) return alert("URL을 입력하세요.");
            
            showLoader(true);
            try {
                const resp = await fetch('/api/process', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url: url, skip_ai: skipAi})
                });
                const data = await resp.json();
                currentUrl = url;
                renderResult(data);
            } catch(e) { alert("처리 중 오류 발생"); }
            showLoader(false);
        }

        async function processFiles() {
            const files = document.getElementById('fileInput').files;
            const skipAi = document.getElementById('skipAiCheck').checked;
            if(files.length === 0) return alert("파일을 선택하세요.");
            if(files.length > 6) return alert("최대 6장까지 가능합니다.");

            showLoader(true);
            const formData = new FormData();
            for(let f of files) formData.append('files', f);
            formData.append('skip_ai', skipAi);

            try {
                const resp = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await resp.json();
                renderResult(data);
            } catch(e) { alert("업로드 오류 발생"); }
            showLoader(false);
        }

        function renderResult(data) {
            document.getElementById('resTitle').value = data.title;
            document.getElementById('resPrice').value = data.original_price;
            document.getElementById('resCategory').value = data.category;
            
            const gallery = document.getElementById('imgGallery');
            gallery.innerHTML = "";
            const images = data.image_paths || [data.image_path];
            const ts = Date.now();

            images.forEach((path, idx) => {
                const div = document.createElement('div');
                div.className = "img-item";
                div.style.marginBottom = "10px";
                div.innerHTML = `
                    <img src="/${path}?t=${ts}" id="img-${idx}" style="width: 100%; display: block; border-radius: 8px;">
                    <input type="number" class="img-order" value="${idx+1}" data-path="${path}" style="position: absolute; top: 5px; left: 5px; width: 30px; background: var(--primary); border: none; color: white; border-radius: 4px; text-align: center; font-weight: bold;">
                    <div style="display: flex; gap: 2px; padding: 4px; background: rgba(0,0,0,0.6); position: absolute; bottom: 0; width: 100%; box-sizing: border-box;">
                        <button onclick="refineImage('${path}', ${idx})" style="font-size: 9px; padding: 4px; flex: 1; background: #17a2b8; border: none; color: white; cursor: pointer; border-radius: 3px;">✨ 정밀</button>
                        <button onclick="openAiThumbModal('${path}', ${idx})" style="font-size: 9px; padding: 4px; flex: 1; background: #6f42c1; border: none; color: white; cursor: pointer; border-radius: 3px;">🎨 AI배경</button>
                    </div>
                `;
                gallery.appendChild(div);
            });
            document.getElementById('resultPanel').style.display = 'grid';
        }

        async function refineImage(path, idx) {
            const img = document.getElementById(`img-${idx}`);
            img.style.opacity = "0.4";
            try {
                const resp = await fetch('/refine', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({path: path})
                });
                const data = await resp.json();
                img.src = "/" + data.new_path + "?t=" + Date.now();
                img.style.opacity = "1";
                alert("✨ 정밀 가공 완료!");
            } catch(e) { alert("오류 발생"); img.style.opacity = "1"; }
        }

        async function openAiThumbModal(path, idx) {
            const promptStr = prompt("AI가 그려줄 배경 프롬프트를 입력하세요\n(예: luxury marble table, soft sunlight, professional studio)");
            if(!promptStr) return;
            
            const img = document.getElementById(`img-${idx}`);
            img.style.opacity = "0.4";
            try {
                const resp = await fetch('/generate_thumb', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({path: path, prompt: promptStr})
                });
                const data = await resp.json();
                img.src = "/" + data.new_path + "?t=" + Date.now();
                img.style.opacity = "1";
                alert("🎨 AI 배경 생성 완료!");
            } catch(e) { alert("AI 생성 오류"); img.style.opacity = "1"; }
        }

        function showLoader(show) {
            document.getElementById('loader').style.display = show ? 'block' : 'none';
        }

        async function listToEbay() {
            const btn = document.getElementById('listBtn');
            const manualPrice = document.getElementById('resPrice').value;
            const manualTitle = document.getElementById('resTitle').value;
            
            const orderInputs = Array.from(document.querySelectorAll('.img-order'));
            const orderedImages = orderInputs
                .sort((a, b) => a.value - b.value)
                .map(input => input.dataset.path);

            btn.innerText = "이베이에 등록 중...";
            btn.disabled = true;

            try {
                const resp = await fetch('/api/list', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        product_id: data.product_id, // Use DB product_id
                        price: manualPrice,
                        title: manualTitle,
                        images: orderedImages
                    })
                });
                const res = await resp.json();
                if(res.listing_id) alert("🎉 등록 성공! ID: " + res.listing_id);
                else alert("❌ 실패: " + JSON.stringify(res));
            } catch(e) { alert("에러 발생"); }
            btn.innerText = "이베이 즉시 등록 승인";
            btn.disabled = false;
        }
    </script>
</body>
</html>
