<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DOBI eBay SaaS</title>
    <style>
        :root { --primary: #0064FF; --dark: #0a0a0a; --text: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--dark); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 400px; text-align: center; backdrop-filter: blur(20px); }
        h1 { margin-bottom: 30px; font-size: 28px; background: linear-gradient(to right, #fff, #0064FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border-radius: 12px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        .toggle-text { margin-top: 20px; font-size: 14px; color: #888; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1 id="title">Welcome Back</h1>
        <p id="desc">이메일만으로 간편하게 시작하세요</p>
        <input type="email" id="email" placeholder="이메일 주소를 입력하세요">
        <button id="mainBtn" onclick="handleAuth()">로그인</button>
        <p class="toggle-text" id="toggle" onclick="toggleMode()">계정이 없으신가요? 회원가입</p>
    </div>

    <script>
        let isLoginMode = true;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('title').innerText = isLoginMode ? "Welcome Back" : "Create Account";
            document.getElementById('mainBtn').innerText = isLoginMode ? "로그인" : "회원가입";
            document.getElementById('toggle').innerText = isLoginMode ? "계정이 없으신가요? 회원가입" : "이미 계정이 있나요? 로그인";
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            if(!email) return alert("이메일을 입력해주세요.");

            const endpoint = isLoginMode ? '/api/login' : '/api/signup';
            try {
                const resp = await fetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: email })
                });
                const data = await resp.json();

                if(data.status === "success") {
                    if(isLoginMode) window.location.reload();
                    else { alert("회원가입 완료! 이제 로그인해주세요."); toggleMode(); }
                } else {
                    alert(data.message || "오류가 발생했습니다.");
                }
            } catch(e) { alert("서버 통신 오류"); }
        }
    </script>
</body>
</html>
