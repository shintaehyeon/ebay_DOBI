<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - DOBI SaaS</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #0064FF; --dark: #050505; --card: rgba(255,255,255,0.05); }
        body { font-family: 'Inter', sans-serif; background: var(--dark); color: white; margin: 0; padding: 40px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .stat-card h3 { font-size: 14px; color: #888; margin: 0; text-transform: uppercase; }
        .stat-card p { font-size: 36px; font-weight: 800; margin: 10px 0 0; color: var(--primary); }
        
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .section { background: var(--card); padding: 30px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); }
        h2 { margin-top: 0; font-size: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 20px; }
        
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; color: #666; padding-bottom: 10px; }
        td { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .bg-blue { background: rgba(0,100,255,0.2); color: #0064FF; }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
        <h1>📊 DOBI SaaS Business Insights</h1>
        <div style="background: #ff4d4d; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 12px;">INTERNAL USE ONLY - CONFIDENTIAL</div>
    </div>
    
    <div id="noDataAlert" style="background: rgba(255,196,0,0.1); border: 1px solid #FFC400; color: #FFC400; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none;">
        현재 수집된 데이터가 부족합니다. 사용자들이 활동을 시작하면 차트가 자동으로 생성됩니다.
    </div>
        <div class="stat-card"><h3>Total Users</h3><p id="totalUsers">0</p></div>
        <div class="stat-card"><h3>Total Listings</h3><p id="totalListings">0</p></div>
        <div class="stat-card"><h3>Active Malls</h3><p id="totalMalls">0</p></div>
        <div class="stat-card"><h3>Revenue (Est.)</h3><p>$ 0.00</p></div>
    </div>

    <div class="row">
        <div class="section">
            <h2>📈 인기 소싱 카테고리</h2>
            <canvas id="categoryChart"></canvas>
        </div>
        <div class="section">
            <h2>⚡ 실시간 사용자 활동 로그</h2>
            <table>
                <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Detail</th></tr></thead>
                <tbody id="logTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadStats() {
            try {
                const resp = await fetch('/api/admin/stats');
                const data = await resp.json();
                
                if(!data.total_users || data.total_users === 0) {
                    document.getElementById('noDataAlert').style.display = 'block';
                    return;
                }

                document.getElementById('totalUsers').innerText = data.total_users;
                document.getElementById('totalListings').innerText = data.total_listings;
                document.getElementById('totalMalls').innerText = data.analytics.sources.length;

                // Log Table
                const logTable = document.getElementById('logTable');
                if(data.recent_logs.length > 0) {
                    logTable.innerHTML = data.recent_logs.map(log => `
                        <tr>
                            <td style="color:#666">${log.timestamp.split(' ')[1]}</td>
                            <td>User #${log.user_id}</td>
                            <td><span class="badge bg-blue">${log.action}</span></td>
                            <td style="color:#888">${log.details || '-'}</td>
                        </tr>
                    `).join('');
                }

                // Chart - Only render if categories exist
                if(data.analytics.categories.length > 0) {
                    const ctx = document.getElementById('categoryChart').getContext('2d');
                    new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: data.analytics.categories.map(c => c.category || 'Unknown'),
                            datasets: [{
                                data: data.analytics.categories.map(c => c.count),
                                backgroundColor: ['#0064FF', '#00C4FF', '#00FFC4', '#FFC400', '#FF00C4'],
                                borderWidth: 0
                            }]
                        },
                        options: { plugins: { legend: { position: 'right', labels: { color: '#fff' } } } }
                    });
                }
            } catch(e) { console.error("Admin Load Error:", e); }
        }
        loadStats();
    </script>
</body>
</html>
